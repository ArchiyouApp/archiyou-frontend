# Basic development stack
# API, redis, worker

services:
  # Redis service (shared by workers)
  redis:
    image: redis:7-alpine
    container_name: archiyou-redis-queue
    ports:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - archiyou-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: archiyou-api
    ports:
      - "4000:4000"
    env_file: .env # all in local .env file
    environment: # overwrite for docker
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - archiyou-network
    volumes:
      # mount script directory
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      # for local library development
      - ./libs/archiyou-core:/libs/archiyou-core
    command: sh -c "tsx src/ApiServer.ts 2>&1 | tee /app/logs/api.log"

  # Execution Worker - Development version with full dependencies
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker.dev
    container_name: archiyou-worker
    env_file: .env # all in local .env file
    environment:
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_ID=worker
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - archiyou-network
    volumes:
      - ./logs:/app/logs
      # for local library development
      - ./libs/archiyou-core:/libs/archiyou-core 
    command: sh -c "tsx src/worker.ts 2>&1 | tee /app/logs/worker.log"

volumes:
  redis_data:
    driver: local

networks:
  archiyou-network:
    driver: bridge
